<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>瓦茲科技 工作坊簡報</title>
<style>
  :root{--bg:#050505;--fg:#F2F2F2;--sub:rgba(255,255,255,.6);--line:rgba(255,255,255,.25)}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    display:flex;align-items:center;justify-content:center;padding:40px 16px}
  main{width:100%;max-width:720px}
  h1{font-size:clamp(26px,5vw,40px);margin:0 0 8px}
  p{color:var(--sub);line-height:1.7;margin:0 0 28px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
  a.card{display:block;padding:24px;border:1.5px solid var(--line);border-radius:6px;color:inherit;text-decoration:none;transition:border-color .2s,background .2s}
  a.card:hover{border-color:var(--fg);background:rgba(255,255,255,.05)}
  a.card b{display:block;font-size:22px;margin-bottom:6px}
  a.card span{color:var(--sub);font-size:15px;line-height:1.6}
  .tip{margin-top:28px;font-size:14px}
</style>
</head>
<body>
<main>
  <h1>瓦茲科技 工作坊簡報</h1>
  <p>兩種視覺風格，內容相同。建議用電腦的 Chrome 開啟，按 F 全螢幕觀看。</p>
  <div class="cards">
    <a class="card" href="galaxy.html"><b>銀河玻璃版</b><span>深空星場、彩色星雲與液態玻璃面板，換頁時光速穿越。</span></a>
    <a class="card" href="bw-pixel.html"><b>黑白像素版</b><span>流動的黑白點陣，文字放在乾淨的黑色區域，換頁時故障閃動。</span></a>
  </div>
  <p class="tip">操作：→ 或點畫面下一步，← 上一步，1 回第一頁，F 全螢幕，? 看所有快捷鍵。</p>
</main>
</body>
</html>
